[general]
static=yes
writeprotect=no

[ema-outbound]
; Outbound number is routed through the Yeastar TG400 SIP peer.
exten => _X.,1,NoOp(EMA outbound alarm notification)
 same => n,Playback(ema/${EMA_PROMPT})
 same => n,Hangup()

[ema-notify]
; The originating call flow plays the generated prompt after answer.
exten => s,1,NoOp(EMA alarm prompt ${EMA_PROMPT})
 same => n,Playback(ema/${EMA_PROMPT})
 same => n,Hangup()

[from-yeastar-tg400]
exten => _X.,1,NoOp(Inbound route from Yeastar gateway)
 same => n,Hangup()
