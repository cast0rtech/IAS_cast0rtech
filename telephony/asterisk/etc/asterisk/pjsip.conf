[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Static peer example. Replace 192.168.1.20 with the TG400 LAN address.
[yeastar-tg400]
type=endpoint
transport=transport-udp
context=from-yeastar-tg400
disallow=all
allow=alaw,ulaw
aors=yeastar-tg400
direct_media=no
identify_by=ip

[yeastar-tg400]
type=aor
contact=sip:192.168.1.20:5060
qualify_frequency=30

[yeastar-tg400-identify]
type=identify
endpoint=yeastar-tg400
match=192.168.1.20
